{% extends "admin/base_admin.html" %}
{% block admin_title %}Editar Equipo{% endblock %}
{% block content %}
<div class="admin-main" style="padding-top: 0;">
    <div class="admin-panel-card">
        <div class="admin-table-head">
            <div>
                <span class="section-kicker">PARTICIPANTES</span>
                <h3 class="admin-panel-title">Modificar datos del equipo</h3>
            </div>
            <a href="{{ url_for('admin.vista_equipos_admin') }}" class="admin-chip">← Volver</a>
        </div>
        <form action="{{ url_for('admin.editar_equipo', id=equipo.id) }}" method="POST" style="padding: 28px; display: grid; gap: 18px;">

            <div style="display: grid; gap: 6px;">
                <label style="color: var(--navy); font-weight: 800;">Nombre del equipo</label>
                <input type="text" name="nombre" value="{{ equipo.nombre }}" required
                       style="min-height: 52px; border-radius: 16px; border: 1px solid #d9e1ee; padding: 0 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%;">
            </div>

            <div style="display: grid; gap: 6px;">
                <label style="color: var(--navy); font-weight: 800;">Categoría</label>
                <select name="categoria" required
                        style="min-height: 52px; border-radius: 16px; border: 1px solid #d9e1ee; padding: 0 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%;">
                    <option value="Juvenil" {% if equipo.categoria == 'Juvenil' %}selected{% endif %}>Juvenil</option>
                    <option value="Libre" {% if equipo.categoria == 'Libre' %}selected{% endif %}>Libre</option>
                    <option value="Femenil" {% if equipo.categoria == 'Femenil' %}selected{% endif %}>Femenil</option>
                </select>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <div style="display: grid; gap: 6px;">
                    <label style="color: var(--navy); font-weight: 800;">Nombre(s) del DT</label>
                    <input type="text" name="representante_nombre" value="{{ equipo.representante_nombre or '' }}"
                           style="min-height: 52px; border-radius: 16px; border: 1px solid #d9e1ee; padding: 0 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%;">
                </div>
                <div style="display: grid; gap: 6px;">
                    <label style="color: var(--navy); font-weight: 800;">Apellido del DT</label>
                    <input type="text" name="representante_apellido" value="{{ equipo.representante_apellido or '' }}"
                           style="min-height: 52px; border-radius: 16px; border: 1px solid #d9e1ee; padding: 0 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%;">
                </div>
            </div>

            <div style="display: grid; gap: 6px;">
                <label style="color: var(--navy); font-weight: 800;">Teléfono de contacto</label>
                <input type="tel" name="telefono" value="{{ equipo.telefono or '' }}" required
                       style="min-height: 52px; border-radius: 16px; border: 1px solid #d9e1ee; padding: 0 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%;">
            </div>

            <div style="display: grid; gap: 6px;">
                <label style="color: var(--navy); font-weight: 800;">Color de uniforme (opcional)</label>
                <input type="text" name="color_uniforme" value="{{ equipo.color_uniforme or '' }}" placeholder="Ej. Rojo y blanco"
                       style="min-height: 52px; border-radius: 16px; border: 1px solid #d9e1ee; padding: 0 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%;">
            </div>

            <div style="display: grid; gap: 6px;">
                <label style="color: var(--navy); font-weight: 800;">Capitán del equipo (opcional)</label>
                <select name="capitan_id"
                        style="min-height: 52px; border-radius: 16px; border: 1px solid #d9e1ee; padding: 0 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%;">
                    <option value="">— Sin capitán asignado —</option>
                    {% for j in jugadores %}
                    <option value="{{ j.id }}" {% if equipo.capitan_id == j.id %}selected{% endif %}>{{ j.nombre }} {{ j.apellido_paterno }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <button type="submit"
                        style="min-height: 52px; padding: 14px 28px; border-radius: 16px; background: var(--gold); color: var(--navy); font-weight: 800; border: none; cursor: pointer; font-size: 1rem;">
                    Actualizar equipo
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
