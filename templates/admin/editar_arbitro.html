{% extends "admin/base_admin.html" %}
{% block admin_title %}Editar Árbitro{% endblock %}
{% block content %}
<div class="admin-main" style="padding-top: 0;">
    <div class="admin-panel-card">
        <div class="admin-table-head">
            <div>
                <span class="section-kicker">CUERPO ARBITRAL</span>
                <h3 class="admin-panel-title">Actualizar datos de árbitro</h3>
            </div>
            <a href="{{ url_for('admin.vista_arbitros_admin') }}" class="admin-chip">← Volver</a>
        </div>
        <form action="{{ url_for('admin.editar_arbitro', id=arbitro.id) }}" method="POST" style="padding: 28px; display: grid; gap: 18px;">

            <div style="display: grid; gap: 6px;">
                <label style="color: var(--navy); font-weight: 800;">Nombre(s)</label>
                <input type="text" name="nombre" value="{{ arbitro.nombre }}" required
                       style="min-height: 52px; border-radius: 16px; border: 1px solid #d9e1ee; padding: 0 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%;">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <div style="display: grid; gap: 6px;">
                    <label style="color: var(--navy); font-weight: 800;">Apellido Paterno</label>
                    <input type="text" name="apellido_paterno" value="{{ arbitro.apellido_paterno }}" required
                           style="min-height: 52px; border-radius: 16px; border: 1px solid #d9e1ee; padding: 0 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%;">
                </div>
                <div style="display: grid; gap: 6px;">
                    <label style="color: var(--navy); font-weight: 800;">Apellido Materno (opcional)</label>
                    <input type="text" name="apellido_materno" value="{{ arbitro.apellido_materno or '' }}"
                           style="min-height: 52px; border-radius: 16px; border: 1px solid #d9e1ee; padding: 0 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%;">
                </div>
            </div>

            <div style="display: grid; gap: 6px;">
                <label style="color: var(--navy); font-weight: 800;">Teléfono</label>
                <input type="text" name="telefono" value="{{ arbitro.telefono }}" required
                       style="min-height: 52px; border-radius: 16px; border: 1px solid #d9e1ee; padding: 0 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%;">
            </div>

            <div style="display: grid; gap: 6px;">
                <label style="color: var(--navy); font-weight: 800;">Estado</label>
                <select name="estado" required
                        style="min-height: 52px; border-radius: 16px; border: 1px solid #d9e1ee; padding: 0 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%;">
                    <option value="Activo" {% if arbitro.estado == 'Activo' %}selected{% endif %}>Activo</option>
                    <option value="Inactivo" {% if arbitro.estado == 'Inactivo' %}selected{% endif %}>Inactivo / Suspendido</option>
                </select>
            </div>

            <div>
                <button type="submit"
                        style="min-height: 52px; padding: 14px 28px; border-radius: 16px; background: var(--gold); color: var(--navy); font-weight: 800; border: none; cursor: pointer; font-size: 1rem;">
                    Guardar cambios
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
