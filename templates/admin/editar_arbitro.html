{% extends "admin/base_admin.html" %}
{% block admin_title %}Editar Árbitro{% endblock %}
{% block content %}
<section class="admin-panel-card" style="max-width: 600px; margin: 0 auto;">
    <span class="section-kicker">CUERPO ARBITRAL</span>
    <h3 class="admin-panel-title">Actualizar datos de árbitro</h3>
    
    <form action="{{ url_for('admin.editar_arbitro', id=arbitro.id) }}" method="POST" class="admin-login-form" style="margin-top: 20px;">
        
        <label for="nombre">Nombre(s):</label>
        <input type="text" id="nombre" name="nombre" value="{{ arbitro.nombre }}" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;">

        <div style="display: flex; gap: 15px; margin-bottom: 15px;">
            <div style="flex: 1;">
                <label for="apellido_paterno">Apellido Paterno:</label>
                <input type="text" id="apellido_paterno" name="apellido_paterno" value="{{ arbitro.apellido_paterno }}" required style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
            </div>
            <div style="flex: 1;">
                <label for="apellido_materno">Apellido Materno (Opcional):</label>
                <input type="text" id="apellido_materno" name="apellido_materno" value="{{ arbitro.apellido_materno or '' }}" style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
            </div>
        </div>

        <label for="telefono">Teléfono (WhatsApp/Celular):</label>
        <input type="text" id="telefono" name="telefono" value="{{ arbitro.telefono }}" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;">

        <label for="estado">Estado:</label>
        <select id="estado" name="estado" required style="width: 100%; padding: 10px; margin-bottom: 20px; border-radius: 5px; border: 1px solid #ccc; font-family: inherit;">
            <option value="Activo" {% if arbitro.estado == 'Activo' %}selected{% endif %}>Activo</option>
            <option value="Inactivo" {% if arbitro.estado == 'Inactivo' %}selected{% endif %}>Inactivo / Suspendido</option>
        </select>

        <div style="display: flex; gap: 10px;">
            <button type="submit" class="btn btn-primary" style="flex: 1;">Guardar Cambios</button>
            <a href="{{ url_for('admin.vista_arbitros_admin') }}" class="btn" style="flex: 1; background-color: #e0e0e0; color: #333; text-align: center; text-decoration: none; padding: 10px; border-radius: 5px; font-weight: bold;">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
