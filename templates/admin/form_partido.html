{% extends "admin/base_admin.html" %}

{% block admin_title %}Programar Partido{% endblock %}

{% block content %}
<section class="admin-panel-card" style="max-width: 600px; margin: 0 auto;">
    <span class="section-kicker">CALENDARIO</span>
    <h3 class="admin-panel-title">Programar nuevo encuentro</h3>
    
    <form action="{{ url_for('admin.crear_partido') }}" method="POST" class="admin-login-form" style="margin-top: 20px;">
        
        <label for="torneo_id">Torneo:</label>
        <select id="torneo_id" name="torneo_id" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc; font-family: inherit;">
            {% for t in torneos %}
                <option value="{{ t.id }}">{{ t.nombre }}</option>
            {% endfor %}
        </select>

        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <div style="flex: 1;">
                <label for="local_id">Equipo Local:</label>
                <select id="local_id" name="local_id" required style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
                    {% for e in equipos %}
                        <option value="{{ e.id }}">{{ e.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div style="flex: 1;">
                <label for="visitante_id">Equipo Visitante:</label>
                <select id="visitante_id" name="visitante_id" required style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
                    {% for e in equipos %}
                        <option value="{{ e.id }}">{{ e.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <label for="cancha_id">Cancha:</label>
        <select id="cancha_id" name="cancha_id" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;">
            {% for c in canchas %}
                <option value="{{ c.id }}">{{ c.nombre }}</option>
            {% endfor %}
        </select>

        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <div style="flex: 1;">
                <label for="fecha_hora">Fecha y Hora:</label>
                <input type="datetime-local" id="fecha_hora" name="fecha_hora" required style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
            </div>
            <div style="flex: 1;">
                <label for="jornada">Jornada:</label>
                <input type="text" id="jornada" name="jornada" placeholder="Ej. J1, Final..." required style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
            </div>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button type="submit" class="btn btn-primary" style="flex: 1;">Agendar Partido</button>
            <a href="{{ url_for('admin.vista_partidos_admin') }}" class="btn" style="flex: 1; background-color: #e0e0e0; color: #333; text-align: center; text-decoration: none; padding: 10px; border-radius: 5px; font-weight: bold;">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
