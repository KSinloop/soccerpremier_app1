<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel administrativo | Soccer Premier Juárez</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="admin-body">

    <aside class="admin-sidebar">
        <div class="admin-brand">
            <div class="admin-brand-mark">SPJ</div>
            <div>
                <span class="admin-brand-kicker">Panel administrativo</span>
                <h1>Soccer Premier Juárez</h1>
            </div>
        </div>

        <nav class="admin-nav">
            <a href="{{ url_for('dashboard_admin') }}" class="admin-nav-link">Dashboard</a>
            <a href="{{ url_for('torneos_admin') }}" class="admin-nav-link">Torneos</a>
            <a href="{{ url_for('equipos_admin') }}" class="admin-nav-link">Equipos</a>
            <a href="{{ url_for('partidos_admin') }}" class="admin-nav-link">Partidos</a>
            <a href="{{ url_for('canchas_admin') }}" class="admin-nav-link">Canchas</a>
            <a href="{{ url_for('estadisticas_admin') }}" class="admin-nav-link">Estadísticas</a>
            <a href="{{ url_for('anuncios_admin') }}" class="admin-nav-link">Anuncios</a>
        </nav>

        <div class="admin-sidebar-footer">
            <a href="{{ url_for('index') }}" class="admin-logout">Volver al portal</a>
        </div>
    </aside>

    <div class="admin-shell">
        <header class="admin-topbar">
            <div>
                <span class="section-kicker">GESTIÓN INTERNA</span>
                <h2 class="admin-page-title">{% block admin_title %}Panel administrativo{% endblock %}</h2>
            </div>

            <div class="admin-topbar-actions">
                <a href="{{ url_for('index') }}" class="admin-chip">Vista pública</a>
                <a href="#" class="admin-chip admin-chip-gold">Nuevo registro</a>
            </div>
        </header>

        <main class="admin-main">
            {% block content %}{% endblock %}
        </main>
    </div>

</body>
</html>
