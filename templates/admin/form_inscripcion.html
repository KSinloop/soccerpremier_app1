{% extends "admin/base_admin.html" %}
{% block admin_title %}Nueva Inscripción{% endblock %}
{% block content %}
<section class="admin-panel-card" style="max-width: 600px; margin: 0 auto;">
    <span class="section-kicker">OPERATIVO</span>
    <h3 class="admin-panel-title">Inscribir equipo a torneo</h3>
    
    <form action="{{ url_for('admin.crear_inscripcion') }}" method="POST" class="admin-login-form" style="margin-top: 20px;">
        
        <label for="torneo_id">Seleccionar Torneo:</label>
        <select id="torneo_id" name="torneo_id" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc; font-family: inherit;">
            <option value="">-- Elige un torneo --</option>
            {% for t in torneos %}
                <option value="{{ t.id }}">{{ t.nombre }} ({{ t.categoria }})</option>
            {% endfor %}
        </select>

        <label for="equipo_id">Seleccionar Equipo:</label>
        <select id="equipo_id" name="equipo_id" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc; font-family: inherit;">
            <option value="">-- Elige un equipo --</option>
            {% for e in equipos %}
                <option value="{{ e.id }}">{{ e.nombre }} ({{ e.categoria }})</option>
            {% endfor %}
        </select>

        <label for="estado_inscripcion">Estado del pago / inscripción:</label>
        <select id="estado_inscripcion" name="estado_inscripcion" required style="width: 100%; padding: 10px; margin-bottom: 20px; border-radius: 5px; border: 1px solid #ccc; font-family: inherit;">
            <option value="Pendiente">Pendiente de Pago</option>
            <option value="Pagada">Pagada</option>
            <option value="Baja">Baja / Retirado</option>
        </select>

        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button type="submit" class="btn btn-primary" style="flex: 1;">Registrar Inscripción</button>
            <a href="{{ url_for('admin.vista_inscripciones_admin') }}" class="btn" style="flex: 1; background-color: #e0e0e0; color: #333; text-align: center; text-decoration: none; padding: 10px; border-radius: 5px; font-weight: bold;">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
