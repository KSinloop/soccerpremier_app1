{% extends "admin/base_admin.html" %}
{% block admin_title %}Alta de Jugador{% endblock %}
{% block content %}
<section class="admin-panel-card" style="max-width: 600px; margin: 0 auto;">
    <span class="section-kicker">PADRÓN</span>
    <h3 class="admin-panel-title">Registrar nuevo jugador</h3>
    
    <form action="{{ url_for('admin.crear_jugador') }}" method="POST" class="admin-login-form" style="margin-top: 20px;">
        <label for="nombre">Nombre(s):</label>
        <input type="text" id="nombre" name="nombre" required>

        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <div style="flex: 1;">
                <label for="apellido_paterno">Apellido Paterno:</label>
                <input type="text" id="apellido_paterno" name="apellido_paterno" required style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
            </div>
            <div style="flex: 1;">
                <label for="apellido_materno">Apellido Materno:</label>
                <input type="text" id="apellido_materno" name="apellido_materno" style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
            </div>
        </div>

        <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;">

        <label for="sexo">Sexo:</label>
        <select id="sexo" name="sexo" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;">
            <option value="Masculino">Masculino</option>
            <option value="Femenino">Femenino</option>
        </select>

        <label for="curp">CURP:</label>
        <input type="text" id="curp" name="curp" maxlength="18" placeholder="Ej. GOMD900101HCHMLG09" style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc; text-transform: uppercase;">

        <label for="foto_url">URL de foto (opcional):</label>
        <input type="url" id="foto_url" name="foto_url" placeholder="https://..." style="width: 100%; padding: 10px; margin-bottom: 20px; border-radius: 5px; border: 1px solid #ccc;">

        <!-- SECCIÓN DE CONTACTO DE EMERGENCIA -->
        <div style="background-color: #ffeeba; padding: 15px; border-radius: 5px; margin-bottom: 20px; border-left: 4px solid #ffc107;">
            <h4 style="margin-top: 0; color: #856404; font-size: 1em;">En caso de emergencia avisar a:</h4>
            
            <label for="nombre_contacto" style="font-size: 0.9em;">Nombre del contacto:</label>
            <input type="text" id="nombre_contacto" name="nombre_contacto" required style="width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc;">
            
            <div style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label for="telefono_contacto" style="font-size: 0.9em;">Teléfono:</label>
                    <input type="text" id="telefono_contacto" name="telefono_contacto" required style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #ccc;">
                </div>
                <div style="flex: 1;">
                    <label for="parentesco" style="font-size: 0.9em;">Parentesco:</label>
                    <input type="text" id="parentesco" name="parentesco" required style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #ccc;">
                </div>
            </div>
        </div>


        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button type="submit" class="btn btn-primary" style="flex: 1;">Guardar Jugador</button>
            <a href="{{ url_for('admin.vista_jugadores_admin') }}" class="btn" style="flex: 1; background-color: #e0e0e0; color: #333; text-align: center; text-decoration: none; padding: 10px; border-radius: 5px; font-weight: bold;">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
