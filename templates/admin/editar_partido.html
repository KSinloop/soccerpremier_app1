{% extends "admin/base_admin.html" %}

{% block admin_title %}Editar Partido{% endblock %}

{% block content %}
<section class="admin-panel-card" style="max-width: 600px; margin: 0 auto;">
    <span class="section-kicker">CALENDARIO</span>
    <h3 class="admin-panel-title">Modificar encuentro</h3>
    
    <form action="{{ url_for('admin.editar_partido', id=partido.id) }}" method="POST" class="admin-login-form" style="margin-top: 20px;">
        
        <label for="torneo_id">Torneo:</label>
        <select id="torneo_id" name="torneo_id" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc; font-family: inherit;">
            {% for t in torneos %}
                <option value="{{ t.id }}" {% if partido.torneo_id == t.id %}selected{% endif %}>{{ t.nombre }}</option>
            {% endfor %}
        </select>

        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <div style="flex: 1;">
                <label for="inscripcion_1_id">Equipo Local:</label>
                <select id="inscripcion_1_id" name="inscripcion_1_id" required style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
                    {% for e in equipos %}
                        <option value="{{ e.id }}" {% if partido.inscripcion_1_id == e.id %}selected{% endif %}>{{ e.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div style="flex: 1;">
                <label for="inscripcion_2_id">Equipo Visitante:</label>
                <select id="inscripcion_2_id" name="inscripcion_2_id" required style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
                    {% for e in equipos %}
                        <option value="{{ e.id }}" {% if partido.inscripcion_2_id == e.id %}selected{% endif %}>{{ e.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <label for="cancha_id">Cancha:</label>
        <select id="cancha_id" name="cancha_id" style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;">
            <option value="">-- Por definir / Sin cancha --</option>
            {% for c in canchas %}
                <option value="{{ c.id }}" {% if partido.cancha_id == c.id %}selected{% endif %}>{{ c.nombre }}</option>
            {% endfor %}
        </select>

        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <div style="flex: 1;">
                <label for="fecha_hora">Fecha y Hora:</label>
                <input type="datetime-local" id="fecha_hora" name="fecha_hora" value="{{ partido.fecha_hora.strftime('%Y-%m-%dT%H:%M') }}" required style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
            </div>
            <div style="flex: 1;">
                <label for="jornada">Jornada:</label>
                <input type="text" id="jornada" name="jornada" value="{{ partido.jornada }}" required style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
            </div>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button type="submit" class="btn btn-primary" style="flex: 1;">Actualizar Partido</button>
            <a href="{{ url_for('admin.vista_partidos_admin') }}" class="btn" style="flex: 1; background-color: #e0e0e0; color: #333; text-align: center; text-decoration: none; padding: 10px; border-radius: 5px; font-weight: bold;">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
