{% extends "admin/base_admin.html" %}

{% block admin_title %}Editar Anuncio{% endblock %}

{% block content %}
<section class="admin-panel-card" style="max-width: 600px; margin: 0 auto;">
    <span class="section-kicker">COMUNICACIÓN</span>
    <h3 class="admin-panel-title">Modificar aviso</h3>
    
   
    <form action="{{ url_for('admin.editar_anuncio', id=anuncio.id) }}" method="POST" class="admin-login-form" style="margin-top: 20px;">
        
        <label for="titulo">Título del anuncio:</label>
        <input type="text" id="titulo" name="titulo" value="{{ anuncio.titulo }}" required>

        <label for="fecha_publicacion">Fecha:</label>
        <input type="date" id="fecha_publicacion" name="fecha_publicacion" value="{{ anuncio.fecha_publicacion }}" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;">

        <label for="contenido">Contenido / Detalles:</label>
        
        <textarea id="contenido" name="contenido" rows="4" required style="width: 100%; padding: 10px; margin-bottom: 20px; border-radius: 5px; border: 1px solid #ccc; font-family: inherit;">{{ anuncio.contenido }}</textarea>

        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button type="submit" class="btn btn-primary" style="flex: 1;">Actualizar Anuncio</button>
            <a href="{{ url_for('admin.vista_anuncios_admin') }}" class="btn" style="flex: 1; background-color: #e0e0e0; color: #333; text-align: center; text-decoration: none; padding: 10px; border-radius: 5px; font-weight: bold;">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
