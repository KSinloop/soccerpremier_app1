{% extends "admin/base_admin.html" %}
{% block admin_title %}Editar Inscripción{% endblock %}
{% block content %}
<div class="admin-main" style="padding-top: 0;">
    <div class="admin-panel-card">
        <div class="admin-table-head">
            <div>
                <span class="section-kicker">OPERATIVO</span>
                <h3 class="admin-panel-title">Actualizar estado de inscripción</h3>
            </div>
            <a href="{{ url_for('admin.vista_inscripciones_admin') }}" class="admin-chip">← Volver</a>
        </div>
        <form action="{{ url_for('admin.editar_inscripcion', id=inscripcion.id) }}" method="POST" style="padding: 28px; display: grid; gap: 18px;">

            <div style="background: #f8fafd; border-radius: 18px; padding: 18px 22px;">
                <p style="margin: 0 0 6px; color: var(--navy); font-weight: 800;">{{ inscripcion.equipo.nombre }}</p>
                <p style="margin: 0; color: var(--muted); font-weight: 700;">{{ inscripcion.torneo.nombre }}</p>
            </div>

            <div style="display: grid; gap: 6px;">
                <label style="color: var(--navy); font-weight: 800;">Estado de la inscripción</label>
                <select name="estado_inscripcion" required
                        style="min-height: 52px; border-radius: 16px; border: 1px solid #d9e1ee; padding: 0 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%;">
                    <option value="Pendiente" {% if inscripcion.estado_inscripcion == 'Pendiente' %}selected{% endif %}>Pendiente de Pago</option>
                    <option value="Pagada" {% if inscripcion.estado_inscripcion == 'Pagada' %}selected{% endif %}>Pagada</option>
                    <option value="Baja" {% if inscripcion.estado_inscripcion == 'Baja' %}selected{% endif %}>Baja / Retirado</option>
                </select>
            </div>

            <div>
                <button type="submit"
                        style="min-height: 52px; padding: 14px 28px; border-radius: 16px; background: var(--gold); color: var(--navy); font-weight: 800; border: none; cursor: pointer; font-size: 1rem;">
                    Actualizar estado
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
