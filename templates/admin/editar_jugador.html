{% extends "admin/base_admin.html" %}
{% block admin_title %}Editar Jugador{% endblock %}
{% block content %}
<div class="admin-main" style="padding-top: 0;">
    <div class="admin-panel-card">
        <div class="admin-table-head">
            <div>
                <span class="section-kicker">PADRÓN</span>
                <h3 class="admin-panel-title">Modificar datos del jugador</h3>
            </div>
            <a href="{{ url_for('admin.vista_jugadores_admin') }}" class="admin-chip">← Volver</a>
        </div>
        <form action="{{ url_for('admin.editar_jugador', id=jugador.id) }}" method="POST" style="padding: 28px; display: grid; gap: 18px;">

            <div style="display: grid; gap: 6px;">
                <label style="color: var(--navy); font-weight: 800;">Nombre(s)</label>
                <input type="text" name="nombre" value="{{ jugador.nombre }}" required
                       style="min-height: 52px; border-radius: 16px; border: 1px solid #d9e1ee; padding: 0 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%;">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <div style="display: grid; gap: 6px;">
                    <label style="color: var(--navy); font-weight: 800;">Apellido Paterno</label>
                    <input type="text" name="apellido_paterno" value="{{ jugador.apellido_paterno }}" required
                           style="min-height: 52px; border-radius: 16px; border: 1px solid #d9e1ee; padding: 0 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%;">
                </div>
                <div style="display: grid; gap: 6px;">
                    <label style="color: var(--navy); font-weight: 800;">Apellido Materno</label>
                    <input type="text" name="apellido_materno" value="{{ jugador.apellido_materno or '' }}"
                           style="min-height: 52px; border-radius: 16px; border: 1px solid #d9e1ee; padding: 0 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%;">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <div style="display: grid; gap: 6px;">
                    <label style="color: var(--navy); font-weight: 800;">Fecha de Nacimiento</label>
                    <input type="date" name="fecha_nacimiento" value="{{ jugador.fecha_nacimiento }}" required
                           style="min-height: 52px; border-radius: 16px; border: 1px solid #d9e1ee; padding: 0 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%;">
                </div>
                <div style="display: grid; gap: 6px;">
                    <label style="color: var(--navy); font-weight: 800;">Sexo</label>
                    <select name="sexo" required
                            style="min-height: 52px; border-radius: 16px; border: 1px solid #d9e1ee; padding: 0 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%;">
                        <option value="Masculino" {% if jugador.sexo == 'Masculino' %}selected{% endif %}>Masculino</option>
                        <option value="Femenino" {% if jugador.sexo == 'Femenino' %}selected{% endif %}>Femenino</option>
                    </select>
                </div>
            </div>

            <div style="display: grid; gap: 6px;">
                <label style="color: var(--navy); font-weight: 800;">CURP (opcional)</label>
                <input type="text" name="curp" maxlength="18" value="{{ jugador.curp or '' }}" placeholder="Ej. GOMD900101HCHMLG09"
                       style="min-height: 52px; border-radius: 16px; border: 1px solid #d9e1ee; padding: 0 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%; text-transform: uppercase;">
            </div>

            <div style="display: grid; gap: 6px;">
                <label style="color: var(--navy); font-weight: 800;">URL de foto (opcional)</label>
                <input type="url" name="foto_url" value="{{ jugador.foto_url or '' }}" placeholder="https://..."
                       style="min-height: 52px; border-radius: 16px; border: 1px solid #d9e1ee; padding: 0 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%;">
            </div>

            <!-- CONTACTO DE EMERGENCIA -->
            <div style="background: #fff6d9; border-radius: 20px; padding: 22px; border-left: 4px solid var(--gold);">
                <h4 style="margin: 0 0 16px; color: var(--navy); font-size: 1rem; font-weight: 800;">En caso de emergencia avisar a:</h4>
                <div style="display: grid; gap: 14px;">
                    <div style="display: grid; gap: 6px;">
                        <label style="color: var(--navy); font-weight: 800; font-size: 0.9rem;">Nombre del contacto</label>
                        <input type="text" name="nombre_contacto"
                               value="{{ jugador.contacto_emergencia.nombre_contacto if jugador.contacto_emergencia else '' }}"
                               style="min-height: 52px; border-radius: 16px; border: 1px solid #d9e1ee; padding: 0 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%; background: white;">
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                        <div style="display: grid; gap: 6px;">
                            <label style="color: var(--navy); font-weight: 800; font-size: 0.9rem;">Teléfono</label>
                            <input type="text" name="telefono_contacto"
                                   value="{{ jugador.contacto_emergencia.telefono if jugador.contacto_emergencia else '' }}"
                                   style="min-height: 52px; border-radius: 16px; border: 1px solid #d9e1ee; padding: 0 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%; background: white;">
                        </div>
                        <div style="display: grid; gap: 6px;">
                            <label style="color: var(--navy); font-weight: 800; font-size: 0.9rem;">Parentesco</label>
                            <input type="text" name="parentesco"
                                   value="{{ jugador.contacto_emergencia.parentesco if jugador.contacto_emergencia else '' }}"
                                   style="min-height: 52px; border-radius: 16px; border: 1px solid #d9e1ee; padding: 0 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%; background: white;">
                        </div>
                    </div>
                </div>
            </div>

            <div>
                <button type="submit"
                        style="min-height: 52px; padding: 14px 28px; border-radius: 16px; background: var(--gold); color: var(--navy); font-weight: 800; border: none; cursor: pointer; font-size: 1rem;">
                    Actualizar jugador
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
