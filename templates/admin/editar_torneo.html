{% extends "admin/base_admin.html" %}
{% block admin_title %}Editar Torneo{% endblock %}
{% block content %}
<div class="admin-main" style="padding-top: 0;">
    <div class="admin-panel-card">
        <div class="admin-table-head">
            <div>
                <span class="section-kicker">COMPETENCIA</span>
                <h3 class="admin-panel-title">Modificar datos del torneo</h3>
            </div>
            <a href="{{ url_for('admin.vista_torneos_admin') }}" class="admin-chip">← Volver</a>
        </div>
        <form action="{{ url_for('admin.editar_torneo', id=torneo.id) }}" method="POST" style="padding: 28px; display: grid; gap: 18px;">

            <div style="display: grid; gap: 6px;">
                <label style="color: var(--navy); font-weight: 800;">Nombre del torneo</label>
                <input type="text" name="nombre" value="{{ torneo.nombre }}" placeholder="Ej. Clausura Premier 2026" required
                       style="min-height: 52px; border-radius: 16px; border: 1px solid #d9e1ee; padding: 0 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%;">
            </div>

            <div style="display: grid; gap: 6px;">
                <label style="color: var(--navy); font-weight: 800;">Día(s) del torneo</label>
                <select id="dia_torneo" name="dia_torneo" required
                        style="min-height: 52px; border-radius: 16px; border: 1px solid #d9e1ee; padding: 0 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%;">
                    <option value="">-- Selecciona el día --</option>
                    <option value="Lunes-Viernes" {% if torneo.dia_torneo == 'Lunes-Viernes' %}selected{% endif %}>Lunes-Viernes</option>
                    <option value="Sabatino" {% if torneo.dia_torneo == 'Sabatino' %}selected{% endif %}>Sabatino</option>
                    <option value="Domingo" {% if torneo.dia_torneo == 'Domingo' %}selected{% endif %}>Domingo</option>
                </select>
            </div>

            <div style="display: grid; gap: 6px;">
                <label style="color: var(--navy); font-weight: 800;">Categoría</label>
                <select id="categoria" name="categoria" required
                        style="min-height: 52px; border-radius: 16px; border: 1px solid #d9e1ee; padding: 0 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%;">
                    <option value="">-- Selecciona el día primero --</option>
                </select>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <div style="display: grid; gap: 6px;">
                    <label style="color: var(--navy); font-weight: 800;">Modalidad (tipo)</label>
                    <select name="tipo" required
                            style="min-height: 52px; border-radius: 16px; border: 1px solid #d9e1ee; padding: 0 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%; background-color: #f1f5f9; cursor: not-allowed;" readonly>
                        <option value="Fútbol 7" selected>Fútbol 7</option>
                    </select>
                </div>
                
                <div style="display: grid; gap: 6px;">
                    <label style="color: var(--navy); font-weight: 800;">Estatus del torneo</label>
                    <select name="estado" required
                            style="min-height: 52px; border-radius: 16px; border: 1px solid #d9e1ee; padding: 0 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%;">
                        <option value="Próximo" {% if torneo.estado == 'Próximo' %}selected{% endif %}>Próximo</option>
                        <option value="Activo" {% if torneo.estado == 'Activo' %}selected{% endif %}>Activo</option>
                        <option value="Finalizado" {% if torneo.estado == 'Finalizado' %}selected{% endif %}>Finalizado</option>
                        <option value="Cancelado" {% if torneo.estado == 'Cancelado' %}selected{% endif %}>Cancelado</option>
                    </select>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <div style="display: grid; gap: 6px;">
                    <label style="color: var(--navy); font-weight: 800;">Fecha de inicio</label>
                    <input type="date" name="fecha_inicio" value="{{ torneo.fecha_inicio }}" required
                           style="min-height: 52px; border-radius: 16px; border: 1px solid #d9e1ee; padding: 0 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%;">
                </div>
                <div style="display: grid; gap: 6px;">
                    <label style="color: var(--navy); font-weight: 800;">Fecha de fin (aprox.)</label>
                    <input type="date" name="fecha_fin" value="{{ torneo.fecha_fin }}" required
                           style="min-height: 52px; border-radius: 16px; border: 1px solid #d9e1ee; padding: 0 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%;">
                </div>
            </div>

            <div>
                <button type="submit"
                        style="min-height: 52px; padding: 14px 28px; border-radius: 16px; background: var(--gold); color: var(--navy); font-weight: 800; border: none; cursor: pointer; font-size: 1rem;">
                    Actualizar torneo
                </button>
            </div>
        </form>
    </div>
</div>

<script>
const categoriasPorDia = {
    
    "Lunes-Viernes": ["Mamás", "Papás", "Varonil", "Femenil", "Mixto"],
    "Sabatino": ["Infantil"],
    "Domingo": ["Libre Varonil", "Libre Femenil"]
    
};
const currentCategoria = "{{ torneo.categoria or '' }}";
const currentDia = "{{ torneo.dia_torneo or '' }}";

function poblarCategorias(dia, seleccionada) {
    const catSelect = document.getElementById('categoria');
    catSelect.innerHTML = '<option value="">-- Selecciona una categoría --</option>';
    const opciones = categoriasPorDia[dia] || [];
    opciones.forEach(function(cat) {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        if (cat === seleccionada) opt.selected = true;
        catSelect.appendChild(opt);
    });
}
if (currentDia) { poblarCategorias(currentDia, currentCategoria); }
document.getElementById('dia_torneo').addEventListener('change', function() {
    poblarCategorias(this.value, '');
});

// === CANDADO DE FECHAS ===
    const inputInicio = document.querySelector('input[name="fecha_inicio"]');
    const inputFin = document.querySelector('input[name="fecha_fin"]');

    if(inputInicio && inputFin) {
        inputInicio.addEventListener('change', function() {
            // El atributo 'min' bloquea los días anteriores en el calendario
            inputFin.min = this.value; 
            
            // Si el admin ya había puesto una fecha fin que ahora quedó en el pasado, se la borramos
            if(inputFin.value && inputFin.value < this.value) {
                inputFin.value = '';
            }
        });
    }
</script>
{% endblock %}
