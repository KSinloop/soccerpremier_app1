<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso administrativo | Soccer Premier Juárez</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="admin-login-body">
    <section class="admin-login-shell">
        <div class="admin-login-brand">
            <div class="admin-brand-mark">SPJ</div>
            <span class="section-kicker">ACCESO INTERNO</span>
            <h1>Soccer Premier Juárez</h1>
            <p>
                Ingresa al panel administrativo para gestionar torneos, equipos, partidos,
                canchas, estadísticas y anuncios.
            </p>
        </div>

        <div class="admin-login-card">
            <span class="section-kicker">INICIAR SESIÓN</span>
            <h2>Panel administrativo</h2>

            <form class="admin-login-form">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" placeholder="Ingresa tu usuario">

                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Ingresa tu contraseña">

                <button type="submit" class="btn btn-primary">Entrar</button>
            </form>
        </div>
    </section>
</body>
</html>
