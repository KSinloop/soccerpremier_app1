{% extends "admin/base_admin.html" %}

{% block admin_title %}Crear Nuevo Anuncio{% endblock %}

{% block content %}
<section class="admin-panel-card" style="max-width: 600px; margin: 0 auto;">
    <span class="section-kicker">COMUNICACIÓN</span>
    <h3 class="admin-panel-title">Redactar aviso</h3>
    
    <form action="{{ url_for('admin.crear_anuncio') }}" method="POST" class="admin-login-form" style="margin-top: 20px;">
        
        <label for="titulo">Título del anuncio:</label>
        <input type="text" id="titulo" name="titulo" placeholder="Ej. Junta de capitanes obligatoria" required>

        <label for="fecha_publicacion">Fecha:</label>
        <input type="date" id="fecha_publicacion" name="fecha_publicacion" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;">

        <label for="categoria">Categoría:</label>
        <select id="categoria" name="categoria" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc; font-family: inherit;">
            <option value="Importante">Importante</option>
            <option value="Evento">Evento</option>
            <option value="Resultados">Resultados</option>
            <option value="Suspensión">Suspensión</option>
            <option value="General">General</option>
        </select>

        <label for="contenido">Contenido / Detalles:</label>
        <textarea id="contenido" name="contenido" rows="4" placeholder="Escribe aquí los detalles del aviso..." required style="width: 100%; padding: 10px; margin-bottom: 20px; border-radius: 5px; border: 1px solid #ccc; font-family: inherit;"></textarea>

        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button type="submit" class="btn btn-primary">Publicar Anuncio</button>
            <a href="{{ url_for('admin.vista_anuncios_admin') }}" class="btn" style="background-color: #ccc; color: #333; text-align: center;">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
