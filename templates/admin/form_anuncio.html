{% extends "admin/base_admin.html" %}
{% block admin_title %}Crear Nuevo Anuncio{% endblock %}
{% block content %}
<div class="admin-main" style="padding-top: 0;">
    <div class="admin-panel-card">
        <div class="admin-table-head">
            <div>
                <span class="section-kicker">COMUNICACIÓN</span>
                <h3 class="admin-panel-title">Redactar aviso</h3>
            </div>
            <a href="{{ url_for('admin.vista_anuncios_admin') }}" class="admin-chip">← Volver</a>
        </div>
        <form action="{{ url_for('admin.crear_anuncio') }}" method="POST" style="padding: 28px; display: grid; gap: 18px;">

            <div style="display: grid; gap: 6px;">
                <label style="color: var(--navy); font-weight: 800;">Título del anuncio</label>
                <input type="text" name="titulo" placeholder="Ej. Junta de capitanes obligatoria" required
                       style="min-height: 52px; border-radius: 16px; border: 1px solid #d9e1ee; padding: 0 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%;">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <div style="display: grid; gap: 6px;">
                    <label style="color: var(--navy); font-weight: 800;">Fecha de publicación</label>
                    <input type="date" name="fecha_publicacion" required
                           style="min-height: 52px; border-radius: 16px; border: 1px solid #d9e1ee; padding: 0 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%;">
                </div>
                <div style="display: grid; gap: 6px;">
                    <label style="color: var(--navy); font-weight: 800;">Categoría</label>
                    <select name="categoria" required
                            style="min-height: 52px; border-radius: 16px; border: 1px solid #d9e1ee; padding: 0 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%;">
                        <option value="Importante">Importante</option>
                        <option value="Evento">Evento</option>
                        <option value="Resultados">Resultados</option>
                        <option value="Suspensión">Suspensión</option>
                        <option value="General">General</option>
                    </select>
                </div>
            </div>

            <div style="display: grid; gap: 6px;">
                <label style="color: var(--navy); font-weight: 800;">Contenido / Detalles</label>
                <textarea name="contenido" rows="5" placeholder="Escribe aquí los detalles del aviso..." required
                          style="border-radius: 16px; border: 1px solid #d9e1ee; padding: 14px 16px; font-size: 1rem; color: var(--text); outline: none; width: 100%; font-family: Arial, sans-serif; resize: vertical;"></textarea>
            </div>

            <div>
                <button type="submit"
                        style="min-height: 52px; padding: 14px 28px; border-radius: 16px; background: var(--gold); color: var(--navy); font-weight: 800; border: none; cursor: pointer; font-size: 1rem;">
                    Publicar anuncio
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
